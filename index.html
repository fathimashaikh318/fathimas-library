<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reading room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #383e56;
    --sky-mid: #545a76;
    --sky-bottom: #888ea2;
    --cloud: #dde1ea;
    --paper: #eef0f4;
    --paper-2: #dde1ea;
    --ink: #232733;
    --ink-soft: #5b6073;
    --bone-ink: #eef0f5;
    --bone-soft: #aab0c2;
    --accent: #8b98d1;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  html,body{ margin:0; padding:0; }
  body{
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    min-height: 100vh;
    font-family: 'Newsreader', serif;
    color: var(--bone-ink);
    overflow-x: hidden;
    position: relative;
  }
  .lower{ text-transform: lowercase; }

  /* ---------- scroll progress ---------- */
  .progress{
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    background: var(--accent);
    box-shadow: 0 0 8px 1px rgba(139,152,209,0.6);
    z-index: 100;
    transition: width .1s linear;
  }

  /* ---------- drifting clouds ---------- */
  .clouds{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .cloud{
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    background: var(--cloud);
    animation: driftx linear infinite;
  }
  .cloud.c1{ width: 640px; height: 240px; top: 6%;  opacity: 0.28; animation-duration: 85s; animation-delay: -10s; }
  .cloud.c2{ width: 520px; height: 200px; top: 22%; opacity: 0.2;  animation-duration: 110s; animation-delay: -40s; }
  .cloud.c3{ width: 760px; height: 280px; top: 40%; opacity: 0.16; animation-duration: 140s; animation-delay: -70s; }
  .cloud.c4{ width: 460px; height: 180px; top: 58%; opacity: 0.22; animation-duration: 95s;  animation-delay: -25s; }
  @keyframes driftx{
    from { transform: translateX(-40vw); }
    to   { transform: translateX(120vw); }
  }
  @media (prefers-reduced-motion: reduce){ .cloud{ animation: none; } }

  /* ---------- rain ---------- */
  .rain{
    position: fixed; inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.22;
    background-image: repeating-linear-gradient(100deg,
      rgba(238,240,245,0.5) 0px, rgba(238,240,245,0.5) 1px,
      transparent 1px, transparent 20px);
    background-size: 100% 160px;
    animation: rainfall 0.6s linear infinite;
  }
  @keyframes rainfall{
    from { background-position: 0 0; }
    to   { background-position: -55px 160px; }
  }
  @media (prefers-reduced-motion: reduce){ .rain{ animation: none; opacity: 0.12; } }

  header, main, footer{ position: relative; z-index: 2; }

  /* ---------- header ---------- */
  header{
    max-width: 1080px;
    margin: 0 auto;
    padding: 90px 6vw 50px;
  }
  .eyebrow{
    display: inline-block;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--bone-soft);
    margin: 0 0 16px;
  }
  h1{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4rem);
    line-height: 1.02;
    margin: 0 0 20px;
    letter-spacing: -0.005em;
    color: var(--bone-ink);
    min-height: 1.05em;
  }
  h1 .caret{
    display: inline-block;
    width: 0.4em;
    height: 0.76em;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: -0.06em;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  header .sub{
    max-width: 46ch;
    color: var(--bone-soft);
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0 0 34px;
  }
  .chips{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip{
    font-family: 'Archivo', sans-serif;
    font-size: 0.82rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid rgba(238,240,245,0.22);
    background: rgba(238,240,245,0.05);
    color: var(--bone-ink);
    cursor: pointer;
    position: relative;
    transition: border-color .3s ease, background .3s ease;
  }
  .chip::after{
    content: "";
    position: absolute;
    left: 14px; right: 14px; bottom: 4px;
    height: 1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s ease;
  }
  .chip:hover{ border-color: var(--accent); background: rgba(139,152,209,0.12); }
  .chip.active::after{ transform: scaleX(1); }

  /* ---------- shelves ---------- */
  main{
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 0 110px;
  }
  .shelf-section{ padding: 44px 6vw 10px; }
  .shelf-label{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 18px;
    color: var(--bone-soft);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .shelf-section.in-view .shelf-label{ opacity: 1; transform: translateY(0); }

  .shelf-wrap{ position: relative; padding-bottom: 32px; }
  .shelf-platform{
    position: absolute;
    left: 2px; right: 2px;
    bottom: 20px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, rgba(238,240,245,0.55), transparent);
    transform: rotate(-0.3deg);
    animation: sway 10s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }
  .shelf-section:nth-child(even) .shelf-platform{
    transform: rotate(0.3deg);
    animation-delay: 2s;
  }
  @keyframes sway{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce){ .shelf-platform{ animation: none; } }

  .shelf{
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    overflow-x: auto;
    padding: 10px 4px 26px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    cursor: grab;
    user-select: none;
  }
  .shelf.dragging{ cursor: grabbing; }
  .shelf::-webkit-scrollbar{ display: none; }

  .book-float{
    flex: 0 0 auto;
    width: 156px;
    height: 244px;
    scroll-snap-align: start;
    animation: sway 8s ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
    filter: blur(5px);
    transition: opacity .8s ease var(--reveal-delay, 0s), filter .8s ease var(--reveal-delay, 0s);
  }
  .shelf-section.in-view .book-float{ opacity: 1; filter: blur(0); }
  .book-float:nth-child(3n){ height: 272px; }
  .book-float:nth-child(4n){ width: 172px; height: 222px; }
  @media (prefers-reduced-motion: reduce){ .book-float{ animation: none; } }

  .book{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 4px 14px 14px 4px;
    border: none;
    background: linear-gradient(170deg, var(--paper) 0%, var(--paper-2) 100%);
    cursor: pointer;
    padding: 22px 18px 18px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    overflow: hidden;
    box-shadow: 0 16px 26px -12px rgba(20,22,32,0.5);
    transition: transform .5s cubic-bezier(.2,.7,.3,1), box-shadow .5s ease;
  }
  .book::before{
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 13px;
    background: linear-gradient(90deg, rgba(35,39,51,0.16), transparent);
  }
  .book::after{
    content: "";
    position: absolute;
    right: 5px; top: 8px; bottom: 8px;
    width: 5px;
    border-radius: 0 6px 6px 0;
    background: repeating-linear-gradient(
      180deg,
      rgba(35,39,51,0.22) 0px, rgba(35,39,51,0.22) 1.5px,
      transparent 1.5px, transparent 4px
    );
  }
  .book:hover, .book:focus-visible{
    transform: translateY(-12px);
    box-shadow: 0 24px 34px -12px rgba(20,22,32,0.55), 0 0 0 1px rgba(139,152,209,0.35);
    outline: none;
  }
  .book .callno{
    align-self: flex-start;
    font-size: 0.78rem;
    font-style: italic;
    color: var(--ink-soft);
    position: relative;
    z-index: 1;
  }
  .book .title{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 1.02rem;
    line-height: 1.28;
    position: relative;
    z-index: 1;
  }
  .book .arrow{
    font-size: 1rem;
    opacity: 0.7;
    color: var(--accent);
    transform: translateX(0);
    transition: transform .3s ease;
    position: relative;
    z-index: 1;
  }
  .book:hover .arrow{ transform: translateX(5px); }

  /* ---------- reading overlay ---------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(20,22,32,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 3vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    z-index: 50;
  }
  .overlay.open{ opacity: 1; pointer-events: auto; }

  .page{
    background: linear-gradient(170deg, var(--paper) 0%, var(--paper-2) 100%);
    color: var(--ink);
    width: min(640px, 100%);
    max-height: 86vh;
    overflow-y: auto;
    border-radius: 6px;
    box-shadow: 0 40px 90px rgba(20,22,32,0.5);
    transform: scale(0.96) translateY(16px);
    transition: transform .5s cubic-bezier(.2,.7,.3,1);
    position: relative;
  }
  .overlay.open .page{ transform: scale(1) translateY(0); }

  .page-head{
    padding: 40px 8vw 24px;
    position: relative;
    border-bottom: 1px solid rgba(35,39,51,0.12);
  }
  .close-mark{
    position: absolute;
    top: 20px; right: 20px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(35,39,51,0.2);
    background: transparent;
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color .25s ease, background .25s ease;
  }
  .close-mark:hover{ border-color: var(--accent); background: rgba(139,152,209,0.15); }

  .page-head .callno{
    display: block;
    font-style: italic;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .page-head h2{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2rem);
    margin: 0 0 6px;
    line-height: 1.2;
  }
  .page-head .byline{
    font-style: italic;
    font-size: 0.98rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .body-text{
    padding: 34px 8vw 46px;
    font-size: 1.1rem;
    font-style: italic;
    line-height: 1.85;
    max-width: 62ch;
  }
  .body-text p{ margin: 0 0 1.25em; }

  footer{
    text-align: center;
    color: var(--bone-soft);
    font-style: italic;
    font-size: 0.9rem;
    padding: 10px 0 60px;
  }

  @media (max-width: 560px){
    header{ padding: 66px 6vw 32px; }
    .book-float{ width: 130px; height: 208px; }
    .page-head, .body-text{ padding-left: 26px; padding-right: 26px; }
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<div class="clouds">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
</div>
<div class="rain"></div>

<header>
  <p class="eyebrow lower">a small library</p>
  <h1 class="lower"><span id="typedText"></span><span class="caret"></span></h1>
  <p class="sub">when shit hits the fan</p>
  <div class="chips" id="chips"></div>
</header>

<main id="shelves"></main>

<footer class="lower">grab a shelf and drag — there's more if you scroll sideways</footer>

<div class="overlay" id="overlay">
  <div class="page" id="page">
    <div class="page-head" id="pageHead">
      <button class="close-mark" id="closeBtn" aria-label="Close">&#10005;</button>
      <span class="callno lower" id="bookTag"></span>
      <h2 id="bookTitle"></h2>
      <p class="byline" id="bookByline"></p>
    </div>
    <div class="body-text" id="bookBody"></div>
  </div>
</div>

<script>
/* ============================================================
   YOUR WRITING GOES HERE.
   Each shelf is a category. Each book is one piece of writing.
   - title: shown on the card and at the top of the reading page
     (rendered in lowercase automatically, so type it however you like)
   - author: the byline
   - paragraphs: an array of strings — one string per paragraph.
     these render in your original capitalization, since it's your
     actual writing, not UI chrome.
   Add, remove, or reorder freely. New shelves = new categories.
   ============================================================ */

const library = [
  {
    shelf: "short fiction",
    books: [
      {
        title: "The Locksmith's Daughter",
        author: "Your Name",
        paragraphs: [
          "Replace this with the opening of your story. This placeholder exists so you can see how the reading view looks and behaves.",
          "Add as many paragraphs as you like here, each as its own line in the array above in the code."
        ]
      },
      {
        title: "Low Tide",
        author: "Your Name",
        paragraphs: [
          "Another placeholder. Swap this out for your own short story — the title on the card can be as short or long as you want."
        ]
      },
      {
        title: "What the Garden Kept",
        author: "Your Name",
        paragraphs: [
          "This is where your story begins. Longer titles wrap fine on the card, so don't worry about keeping them short."
        ]
      }
    ]
  },
  {
    shelf: "essays",
    books: [
      {
        title: "On Being Late",
        author: "Your Name",
        paragraphs: [
          "Drop your essay text in here. The reading page supports as many paragraphs as you need — it scrolls."
        ]
      },
      {
        title: "A Short History of My Kitchen Table",
        author: "Your Name",
        paragraphs: [
          "Placeholder text for a longer essay title, to show how it looks on the card when it runs long."
        ]
      }
    ]
  },
  {
    shelf: "poetry",
    books: [
      {
        title: "Small Weather",
        author: "Your Name",
        paragraphs: [
          "Poems can go here too — one stanza per paragraph line works well."
        ]
      },
      {
        title: "Field Notes",
        author: "Your Name",
        paragraphs: [
          "Another poetry placeholder to round out the shelf."
        ]
      },
      {
        title: "Nocturne",
        author: "Your Name",
        paragraphs: [
          "One more placeholder — swap it for the real thing whenever you're ready."
        ]
      }
    ]
  }
];

const shelvesEl = document.getElementById('shelves');
const chipsEl = document.getElementById('chips');
const overlay = document.getElementById('overlay');
const pageEl = document.getElementById('page');
const bookTag = document.getElementById('bookTag');
const bookTitle = document.getElementById('bookTitle');
const bookByline = document.getElementById('bookByline');
const bookBody = document.getElementById('bookBody');

const chipRefs = [];

library.forEach((section, si) => {
  const sectionId = 'shelf-' + si;

  const chip = document.createElement('button');
  chip.className = 'chip lower';
  chip.textContent = section.shelf;
  chip.addEventListener('click', () => {
    document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  chipsEl.appendChild(chip);
  chipRefs.push({ id: sectionId, el: chip });

  const wrap = document.createElement('div');
  wrap.className = 'shelf-section';
  wrap.id = sectionId;

  const label = document.createElement('p');
  label.className = 'shelf-label lower';
  label.textContent = section.shelf;
  wrap.appendChild(label);

  const shelfWrap = document.createElement('div');
  shelfWrap.className = 'shelf-wrap';

  const platform = document.createElement('div');
  platform.className = 'shelf-platform';
  shelfWrap.appendChild(platform);

  const shelf = document.createElement('div');
  shelf.className = 'shelf';

  section.books.forEach((book, bi) => {
    const float = document.createElement('div');
    float.className = 'book-float';
    float.style.setProperty('--delay', (bi * 0.5) + 's');
    float.style.setProperty('--reveal-delay', (bi * 0.12) + 's');

    const card = document.createElement('button');
    card.className = 'book';
    card.setAttribute('aria-label', 'Open ' + book.title);

    const callno = document.createElement('span');
    callno.className = 'callno lower';
    callno.textContent = 'no. ' + String(si * 10 + bi + 1).padStart(2, '0');
    card.appendChild(callno);

    const bottom = document.createElement('div');
    bottom.style.display = 'flex';
    bottom.style.justifyContent = 'space-between';
    bottom.style.alignItems = 'flex-end';
    bottom.style.gap = '8px';

    const title = document.createElement('span');
    title.className = 'title lower';
    title.textContent = book.title;

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.innerHTML = '&#8594;';

    bottom.appendChild(title);
    bottom.appendChild(arrow);
    card.appendChild(bottom);

    card.addEventListener('click', () => openBook(book, section.shelf));
    float.appendChild(card);
    shelf.appendChild(float);
  });

  shelfWrap.appendChild(shelf);
  wrap.appendChild(shelfWrap);
  shelvesEl.appendChild(wrap);

  let isDown = false, startX = 0, startScroll = 0;
  shelf.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    isDown = true;
    shelf.classList.add('dragging');
    startX = e.clientX;
    startScroll = shelf.scrollLeft;
  });
  window.addEventListener('pointermove', e => {
    if (!isDown) return;
    shelf.scrollLeft = startScroll - (e.clientX - startX);
  });
  window.addEventListener('pointerup', () => {
    isDown = false;
    shelf.classList.remove('dragging');
  });
});

function openBook(book, shelfName){
  bookTag.textContent = shelfName;
  bookTitle.textContent = book.title;
  bookByline.textContent = 'by ' + book.author;
  bookBody.innerHTML = book.paragraphs.map(p => `<p>${p}</p>`).join('');
  overlay.classList.add('open');
  pageEl.scrollTop = 0;
}
function closeBook(){ overlay.classList.remove('open'); }
document.getElementById('closeBtn').addEventListener('click', closeBook);
overlay.addEventListener('click', e => { if (e.target === overlay) closeBook(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBook(); });

// reveal shelf sections + scrollspy nav highlighting
const io = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      const match = chipRefs.find(c => c.id === entry.target.id);
      chipRefs.forEach(c => c.el.classList.remove('active'));
      if (match) match.el.classList.add('active');
    }
  });
}, { threshold: 0.35 });
document.querySelectorAll('.shelf-section').forEach(el => io.observe(el));

// scroll progress bar
const progress = document.getElementById('progress');
function onScroll(){
  const doc = document.documentElement;
  const max = doc.scrollHeight - doc.clientHeight;
  const pct = max > 0 ? (doc.scrollTop / max) * 100 : 0;
  progress.style.width = pct + '%';
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

// one-time typewriter reveal of the headline
const fullTitle = "reading room";
const typedText = document.getElementById('typedText');
let ti = 0;
function typeNext(){
  if (ti <= fullTitle.length){
    typedText.textContent = fullTitle.slice(0, ti);
    ti++;
    setTimeout(typeNext, 75 + Math.random() * 55);
  }
}
typeNext();
</script>

</body>
</html>
