<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reading room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0b0c0a;
    --void-2: #14150f;
    --concrete: #2c3037;
    --concrete-2: #1a1c20;
    --paper: #e6e3da;
    --paper-2: #d5d1c4;
    --ink: #1c1e1f;
    --ink-soft: #55584f;
    --bone-ink: #eae7de;
    --bone-soft: #93968f;
    --accent: #e0a458;
    --cyan: #5fd4c8;
    --neon-magenta: #ff2e7e;
    --neon-red: #d1332e;
    --sick-green: #8fae3a;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  html,body{ margin:0; padding:0; }
  body{
    background: linear-gradient(180deg, var(--void) 0%, var(--void-2) 55%, var(--void) 100%);
    min-height: 100vh;
    font-family: 'Newsreader', serif;
    color: var(--bone-ink);
    overflow-x: hidden;
    position: relative;
  }
  .lower{ text-transform: lowercase; }
  .mono{ font-family: 'IBM Plex Mono', monospace; }

  /* ---------- scroll progress ---------- */
  .progress{
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    background: var(--accent);
    box-shadow: 0 0 8px 1px rgba(224,164,88,0.6);
    z-index: 100;
    transition: width .1s linear;
  }

  /* ---------- skyline ---------- */
  .skyline-far{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 44vh;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
    filter: blur(2px);
    opacity: 0.55;
  }
  .skyline{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 40vh;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .skyline::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--void) 0%, transparent 40%);
    z-index: 2;
  }
  .building{
    position: absolute;
    bottom: 0;
    background: linear-gradient(180deg, var(--concrete) 0%, var(--concrete-2) 100%);
  }
  .building.far{
    background: linear-gradient(180deg, #1c1e18 0%, #101208 100%);
  }
  .window{
    position: absolute;
    width: 4px; height: 7px;
    background: var(--accent);
    opacity: 0.5;
  }
  .window.cyan{ background: var(--cyan); }
  .window.flicker{ animation: flicker 5s ease-in-out infinite; }
  @keyframes flicker{
    0%, 42% { opacity: 0.55; }
    50% { opacity: 0.05; }
    58% { opacity: 0.5; }
    80% { opacity: 0.15; }
    86% { opacity: 0.55; }
    100% { opacity: 0.55; }
  }
  @media (prefers-reduced-motion: reduce){ .window.flicker{ animation: none; opacity: 0.4; } }

  /* neon signage, hung on a handful of buildings */
  .sign{
    position: absolute;
    border-radius: 1px;
    filter: blur(0.2px);
    animation: neonflicker 6s ease-in-out infinite;
  }
  .sign.magenta{ background: var(--neon-magenta); box-shadow: 0 0 10px 2px rgba(255,46,126,0.7), 0 0 24px 4px rgba(255,46,126,0.3); }
  .sign.red{ background: var(--neon-red); box-shadow: 0 0 10px 2px rgba(209,51,46,0.7), 0 0 24px 4px rgba(209,51,46,0.3); }
  .sign.green{ background: var(--sick-green); box-shadow: 0 0 10px 2px rgba(143,174,58,0.7), 0 0 24px 4px rgba(143,174,58,0.3); }
  @keyframes neonflicker{
    0%, 88% { opacity: 1; }
    90% { opacity: 0.2; }
    92% { opacity: 1; }
    94% { opacity: 0.3; }
    96% { opacity: 1; }
    100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){ .sign{ animation: none; } }

  /* sickly color-grade + heavy vignette, over everything */
  .grime{
    position: fixed; inset: 0;
    z-index: 4;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%),
      linear-gradient(rgba(90,110,40,0.06), rgba(90,110,40,0.06));
    mix-blend-mode: multiply;
  }

  /* ---------- rain ---------- */
  .rain{
    position: fixed; inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.14;
    background-image: repeating-linear-gradient(102deg,
      rgba(234,231,222,0.5) 0px, rgba(234,231,222,0.5) 1px,
      transparent 1px, transparent 22px);
    background-size: 100% 170px;
    animation: rainfall 0.65s linear infinite;
  }
  @keyframes rainfall{
    from { background-position: 0 0; }
    to   { background-position: -60px 170px; }
  }
  @media (prefers-reduced-motion: reduce){ .rain{ animation: none; opacity: 0.08; } }

  /* ---------- scanlines + glitch ---------- */
  .scanlines{
    position: fixed; inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.05;
    background-image: repeating-linear-gradient(0deg,
      rgba(255,255,255,0.7) 0px, rgba(255,255,255,0.7) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }
  .glitching{
    animation: glitchjitter .22s steps(3) 1;
  }
  @keyframes glitchjitter{
    0%{ transform: none; text-shadow: none; }
    20%{ transform: translate(-2px, 1px); text-shadow: -2px 0 var(--cyan), 2px 0 var(--accent); }
    40%{ transform: translate(2px, -1px); text-shadow: 2px 0 var(--cyan), -2px 0 var(--accent); }
    60%{ transform: translate(-1px, 0); text-shadow: -1px 0 var(--cyan), 1px 0 var(--accent); }
    100%{ transform: none; text-shadow: none; }
  }
  @media (prefers-reduced-motion: reduce){ .glitching{ animation: none; } }

  header, main, footer{ position: relative; z-index: 2; }

  /* ---------- header ---------- */
  header{
    max-width: 1080px;
    margin: 0 auto;
    padding: 90px 6vw 50px;
  }
  .eyebrow{
    display: inline-block;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--bone-soft);
    margin: 0 0 16px;
  }
  h1{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4rem);
    line-height: 1.02;
    margin: 0 0 20px;
    letter-spacing: -0.005em;
    color: var(--bone-ink);
    min-height: 1.05em;
  }
  h1 .caret{
    display: inline-block;
    width: 0.4em;
    height: 0.76em;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: -0.06em;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  header .sub{
    max-width: 46ch;
    color: var(--bone-soft);
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0 0 34px;
  }
  .chips{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    padding: 9px 18px;
    border-radius: 3px;
    border: 1px solid rgba(234,231,222,0.18);
    background: rgba(234,231,222,0.04);
    color: var(--bone-ink);
    cursor: pointer;
    position: relative;
    transition: border-color .3s ease, background .3s ease;
  }
  .chip::after{
    content: "";
    position: absolute;
    left: 14px; right: 14px; bottom: 4px;
    height: 1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s ease;
  }
  .chip:hover{ border-color: var(--accent); background: rgba(224,164,88,0.1); }
  .chip.active::after{ transform: scaleX(1); }

  /* ---------- shelves ---------- */
  main{
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 0 110px;
  }
  .shelf-section{ padding: 44px 6vw 10px; }
  .shelf-label{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 18px;
    color: var(--bone-soft);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .shelf-section.in-view .shelf-label{ opacity: 1; transform: translateY(0); }

  .shelf-wrap{ position: relative; padding-bottom: 32px; }
  .shelf-platform{
    position: absolute;
    left: 2px; right: 2px;
    bottom: 20px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, rgba(224,164,88,0.4), transparent);
    transform: rotate(-0.3deg);
    animation: sway 10s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }
  .shelf-section:nth-child(even) .shelf-platform{
    transform: rotate(0.3deg);
    animation-delay: 2s;
  }
  @keyframes sway{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce){ .shelf-platform{ animation: none; } }

  /* the shelf viewport is fixed-width and clips; the track inside it
     is doubled in JS and drifts sideways in a seamless loop */
  .shelf{
    position: relative;
    z-index: 1;
    overflow: hidden;
    padding: 10px 4px 26px;
  }
  .shelf-track{
    display: flex;
    align-items: flex-end;
    gap: 20px;
    width: max-content;
    animation-name: marquee;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: var(--duration, 50s);
    animation-direction: var(--dir, normal);
  }
  .shelf:hover .shelf-track,
  .shelf-track.paused{
    animation-play-state: paused;
  }
  @keyframes marquee{
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .shelf-track{ animation: none; }
    .shelf{ overflow-x: auto; }
  }

  .book-float{
    flex: 0 0 auto;
    width: 156px;
    height: 244px;
    animation: sway 8s ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
    filter: blur(5px);
    transition: opacity .8s ease var(--reveal-delay, 0s), filter .8s ease var(--reveal-delay, 0s);
  }
  .shelf-section.in-view .book-float{ opacity: 1; filter: blur(0); }
  .book-float:nth-child(3n){ height: 272px; }
  .book-float:nth-child(4n){ width: 172px; height: 222px; }
  @media (prefers-reduced-motion: reduce){ .book-float{ animation: none; } }

  .book{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 4px 14px 14px 4px;
    border: none;
    background: linear-gradient(170deg, var(--paper) 0%, var(--paper-2) 100%);
    cursor: pointer;
    padding: 22px 18px 18px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    overflow: hidden;
    box-shadow: 0 16px 26px -12px rgba(0,0,0,0.6);
    transition: transform .5s cubic-bezier(.2,.7,.3,1), box-shadow .5s ease;
  }
  .book::before{
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 13px;
    background: linear-gradient(90deg, rgba(28,30,31,0.18), transparent);
  }
  .book::after{
    content: "";
    position: absolute;
    right: 5px; top: 8px; bottom: 8px;
    width: 5px;
    border-radius: 0 6px 6px 0;
    background: repeating-linear-gradient(
      180deg,
      rgba(28,30,31,0.24) 0px, rgba(28,30,31,0.24) 1.5px,
      transparent 1.5px, transparent 4px
    );
  }
  .book:hover, .book:focus-visible{
    transform: translateY(-12px);
    box-shadow: 0 24px 34px -12px rgba(0,0,0,0.65), 0 0 0 1px rgba(224,164,88,0.4);
    outline: none;
  }
  .book .callno{
    align-self: flex-start;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    position: relative;
    z-index: 1;
  }
  .book .title{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 1.02rem;
    line-height: 1.28;
    position: relative;
    z-index: 1;
  }
  .book .arrow{
    font-size: 1rem;
    opacity: 0.8;
    color: var(--accent);
    transform: translateX(0);
    transition: transform .3s ease;
    position: relative;
    z-index: 1;
  }
  .book:hover .arrow{ transform: translateX(5px); }

  /* ---------- reading overlay ---------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(12,14,17,0.72);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 3vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    z-index: 50;
  }
  .overlay.open{ opacity: 1; pointer-events: auto; }

  .page{
    background: linear-gradient(170deg, var(--paper) 0%, var(--paper-2) 100%);
    color: var(--ink);
    width: min(640px, 100%);
    max-height: 86vh;
    overflow-y: auto;
    overflow-x: hidden;
    border-radius: 6px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.6);
    transform: scale(0.96) translateY(16px);
    transition: transform .5s cubic-bezier(.2,.7,.3,1);
    position: relative;
  }
  .overlay.open .page{ transform: scale(1) translateY(0); }

  .page::after{
    content: "";
    position: absolute;
    left: 0; right: 0; top: -12%;
    height: 12%;
    background: linear-gradient(180deg, transparent 0%, rgba(224,164,88,0.35) 50%, transparent 100%);
    pointer-events: none;
    opacity: 0;
  }
  .overlay.open .page::after{
    animation: scan 0.9s ease-out .1s 1;
  }
  @keyframes scan{
    0%{ top: -12%; opacity: 1; }
    85%{ opacity: 0.5; }
    100%{ top: 108%; opacity: 0; }
  }

  .page-head{
    padding: 40px 8vw 24px;
    position: relative;
    border-bottom: 1px solid rgba(28,30,31,0.14);
  }
  .close-mark{
    position: absolute;
    top: 20px; right: 20px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(28,30,31,0.22);
    background: transparent;
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color .25s ease, background .25s ease;
  }
  .close-mark:hover{ border-color: var(--accent); background: rgba(224,164,88,0.15); }

  .page-head .callno{
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .page-head h2{
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2rem);
    margin: 0 0 6px;
    line-height: 1.2;
  }
  .page-head .byline{
    font-style: italic;
    font-size: 0.98rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .body-text{
    padding: 34px 8vw 46px;
    font-family: 'Archivo', sans-serif;
    font-weight: 400;
    font-size: 1.02rem;
    line-height: 1.8;
    max-width: 62ch;
  }
  .body-text p{ margin: 0 0 1.25em; }

  footer{
    text-align: center;
    color: var(--bone-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    padding: 10px 0 60px;
  }

  @media (max-width: 560px){
    header{ padding: 66px 6vw 32px; }
    .book-float{ width: 130px; height: 208px; }
    .page-head, .body-text{ padding-left: 26px; padding-right: 26px; }
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<div class="skyline-far" id="skylineFar"></div>
<div class="skyline" id="skyline"></div>
<div class="rain"></div>
<div class="scanlines"></div>
<div class="grime"></div>

<header>
  <p class="eyebrow lower mono">[ a small library ]</p>
  <h1 class="lower" id="mainTitle"><span id="typedText"></span><span class="caret"></span></h1>
  <p class="sub">work in project</p>
  <div class="chips" id="chips"></div>
</header>

<main id="shelves"></main>

<footer class="lower">shelves drift on their own — hover to pause, tap a book to open</footer>

<div class="overlay" id="overlay">
  <div class="page" id="page">
    <div class="page-head" id="pageHead">
      <button class="close-mark" id="closeBtn" aria-label="Close">&#10005;</button>
      <span class="callno lower" id="bookTag"></span>
      <h2 id="bookTitle"></h2>
      <p class="byline" id="bookByline"></p>
    </div>
    <div class="body-text" id="bookBody"></div>
  </div>
</div>

<script>
/* ============================================================
   YOUR WRITING GOES HERE.
   Each shelf is a category. Each book is one piece of writing.
   - title: shown on the card and at the top of the reading page
     (rendered in lowercase automatically, so type it however you like)
   - author: the byline
   - paragraphs: an array of strings — one string per paragraph.
     these render in your original capitalization, since it's your
     actual writing, not UI chrome.
   Add, remove, or reorder freely. New shelves = new categories.
   ============================================================ */

const library = [
  {
    shelf: "short fiction",
    books: [
      {
        title: "in my Mind there are Thoughts that take Flesh",
        author: "Fathima",
        paragraphs: [
          "In my mind there are Thoughts that take flesh. Become human, inhabit my body and wander to the corner store on my street after 7 pm on sticky summer days. While the sun is about to set, these Thoughts buy a pop, a bag of chips, let the sweating bottle cool my forehead. I wander about with worn-down sandals, along Chicago Ave. There are tiny rocks from crumbling sidewalks that press to my feet. I let the Sidewalk Crumbs stay, even though they bother me.",
          "Bodegas have become my safe haven recently. The man behind the counter at the one I just went to told me that I was beautiful, but I think he was lying. Still, warmth swells in my chest. The Sidewalk Crumb pain becomes tolerable because of this attention alone.",
          "My Thoughts take me on a very simple, rectangular route that takes around 1.5 hours. I am always back before darkness cloaks my city entirely, before the cicadas' buzz becomes a concoction of paranoia mixed with eerie nostalgia, trepid ghosts.",
          "The Sidewalk Crumbs continue to press into my soles, but the comfort that comes with removing them from my feet is at the cost of much effort. First, I must find a bare spot with not much traffic. Then comes the act of bending to the ground. Removing the shoe. Picking it up and emptying the contents out. This whole while, I must be balancing on one foot while doing so, lest I dirty my bare foot with the sidewalk in all its urban glory. Spat out gum, Saturday-night vomits, and dog piss and whatnot.",
          "So the Sidewalk Crumbs stay and my Thoughts come to the forefront again.",
          "This evening, the Thoughts had a tinge of greed to them, an impossible future painted in my mind. I had infinite money at my fingertips, been able to snap my fingers and have butlers and servants at my feet. Had looked at the clear sky and whispered for clouds, touched rain with my finger tips and asked for sunshine. Been a genie with it almost, Gucci bucket hats and flashy LV's, heavy on my feet, cocaine smattering my nose like sugar, ketamine in my bedside drawer.",
          "This is known though, money exists, pools, no oceans of it, smothering some, starving others, and people fight. Yes, I know this too, people fight over it, start wars and kill, create countries but destroy them too, rape and invent. Ingenuity born from greed, it's nothing short of poetry, guns as currency and bombs as checks. The isolation that comes with it masked as exclusivity.",
          "This night, I had been given all the money in the world but no dreams to channel it into. Only my basic human desires -- greed, lust, hunger, thirst. A mess, no viable path outwards, no truth, guidance, or direction. I fulfilled my own desires by outsourcing them, paying for chefs and prostitutes and mirrors. Sounds incredibly boring, how vain!",
          "(I am ashamed that my Thoughts stay immersed in this for the better part of my 1.5-hour routine walk, so much so that I only notice the darkness settling in when the distant shriek of an ambulance slices the muggy air.)",
          "I wonder who is hurt, or dying, or dead. I wonder what Thoughts accompanied them in the moments preceding their call for help. I think of Bodega man and him calling me beautiful. My Thoughts decide to end the night settled on this instead.",
          "The bag of chips in my hand are unopened, the pop too. The condensation still leaves my palms wet. Everything leaves its mark, inevitably.",
          "Maybe Bodega man was right."
        ]
      },
      {
        title: "Nothing in this world",
        author: "Fathima",
        paragraphs: [
          "Nothing in this world has made sense to me for a very long time. I find myself wandering streets in cities whose names had seemed familiar on paper, from the comfort of my childhood bedroom, oh so long ago. But in the flesh I am unkept, tousled hair, polluted skin, glass buildings that rid me of any sense of stability my small childish brain yearned to keep. It is all so so fragile, so make-believe, that on my morning commute, I have to reach my hand out to touch it. Feel the glass, close my eyes and visualize its creation. Glistening buildings lose their prowess, the people in them turn to dust. Dismantle it all into what it really is, sand and dust, in all its glory.",
          "Then there is the smell of a cigarette, the cough of a sick man, the plea of a beggar, and I am awoken from this state. Rushed back to the tempo of normal life.",
          "\"Do you miss this?\" I am in bed with Lilah. I am tracing circles on her back because it helps her sleep. She is on my chest and her voice is a sweet murmur.",
          "\"Yes.\" I feel empty as I speak.",
          "\"Me too. I wish it could stay like this.\" She nuzzles into me and to this I can fake no response.",
          "At 4 a.m's, most nights, I lie awake, unable to sleep, paralyzed by some sort of forbidden cloud that maneuvers its way onto my chest. I think of my mother and my brother and my grandmother far away from me, and I think of what a blessing it was to be in their presence, when I had it. To know there were people I could call mine only a walk away, to have a structure to my day. In the ambiguity of days and weeks blending together, I lose sight of this.",
          "I think of the past a lot and find myself unable to move forward. Living in my memories as if it is some sort of sludge I cannot shake off. Everything reminds me of something. Absolutely nothing is clean of a record, the sky in whatever somber shade it takes on, the dislodged brick tilting from the bodega, the cigarette stump crushed between the cracks of a sidewalk. In it, I see poetry.",
          "I live life chained heavily to these bits of nostalgia, and often find myself drowning because of it. Breaking free comes at the cost of isolation and a foreignness that I am unable to muster yet. I cannot do it, I am too weak, too fragile, too soft. I yearn for my mother's hands and for the timidness of a childhood."
        ]
      },
      {
        title: "Who I am",
        author: "Fathima",
        paragraphs: [

const shelvesEl = document.getElementById('shelves');
const chipsEl = document.getElementById('chips');
const overlay = document.getElementById('overlay');
const pageEl = document.getElementById('page');
const bookTag = document.getElementById('bookTag');
const bookTitle = document.getElementById('bookTitle');
const bookByline = document.getElementById('bookByline');
const bookBody = document.getElementById('bookBody');

const chipRefs = [];

function makeBookFloat(book, section, bi){
  const float = document.createElement('div');
  float.className = 'book-float';
  float.style.setProperty('--delay', (bi * 0.5) + 's');
  float.style.setProperty('--reveal-delay', (bi * 0.12) + 's');

  const card = document.createElement('button');
  card.className = 'book';
  card.setAttribute('aria-label', 'Open ' + book.title);

  const callno = document.createElement('span');
  callno.className = 'callno lower';
  callno.textContent = 'no. ' + String(bi + 1).padStart(2, '0');
  card.appendChild(callno);

  const bottom = document.createElement('div');
  bottom.style.display = 'flex';
  bottom.style.justifyContent = 'space-between';
  bottom.style.alignItems = 'flex-end';
  bottom.style.gap = '8px';

  const title = document.createElement('span');
  title.className = 'title lower';
  title.textContent = book.title;

  const arrow = document.createElement('span');
  arrow.className = 'arrow';
  arrow.innerHTML = '&#8594;';

  bottom.appendChild(title);
  bottom.appendChild(arrow);
  card.appendChild(bottom);

  card.addEventListener('click', () => openBook(book, section.shelf));
  float.appendChild(card);
  return float;
}

library.forEach((section, si) => {
  const sectionId = 'shelf-' + si;

  const chip = document.createElement('button');
  chip.className = 'chip lower';
  chip.textContent = section.shelf;
  chip.addEventListener('click', () => {
    document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  chipsEl.appendChild(chip);
  chipRefs.push({ id: sectionId, el: chip });

  const wrap = document.createElement('div');
  wrap.className = 'shelf-section';
  wrap.id = sectionId;

  const label = document.createElement('p');
  label.className = 'shelf-label lower';
  label.textContent = section.shelf;
  wrap.appendChild(label);

  const shelfWrap = document.createElement('div');
  shelfWrap.className = 'shelf-wrap';

  const platform = document.createElement('div');
  platform.className = 'shelf-platform';
  shelfWrap.appendChild(platform);

  const shelf = document.createElement('div');
  shelf.className = 'shelf';

  const track = document.createElement('div');
  track.className = 'shelf-track';
  // odd shelves drift the opposite direction, just for variety
  track.style.setProperty('--dir', si % 2 === 0 ? 'normal' : 'reverse');

  // render the row twice back-to-back so a 50%-width translateX loops seamlessly
  for (let copy = 0; copy < 2; copy++){
    section.books.forEach((book, bi) => {
      track.appendChild(makeBookFloat(book, section, bi));
    });
  }
  shelf.appendChild(track);

  // pause the drift on touch devices while someone's trying to tap a book
  shelf.addEventListener('touchstart', () => track.classList.add('paused'), { passive: true });
  shelf.addEventListener('touchend', () => setTimeout(() => track.classList.remove('paused'), 400));

  shelfWrap.appendChild(shelf);
  wrap.appendChild(shelfWrap);
  shelvesEl.appendChild(wrap);

  // set the loop duration from the actual rendered width so speed stays
  // consistent (~36px/s) no matter how many books are on the shelf
  requestAnimationFrame(() => {
    const fullWidth = track.scrollWidth / 2;
    const duration = Math.max(18, fullWidth / 36);
    track.style.setProperty('--duration', duration + 's');
  });
});

function openBook(book, shelfName){
  bookTag.textContent = shelfName;
  bookTitle.textContent = book.title;
  bookByline.textContent = 'by ' + book.author;
  bookBody.innerHTML = book.paragraphs.map(p => `<p>${p}</p>`).join('');
  overlay.classList.add('open');
  pageEl.scrollTop = 0;
}
function closeBook(){ overlay.classList.remove('open'); }
document.getElementById('closeBtn').addEventListener('click', closeBook);
overlay.addEventListener('click', e => { if (e.target === overlay) closeBook(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBook(); });

  const w = window.innerWidth;

  // far, hazier layer — taller, sparser, no windows, just silhouette

    b.style.width = bw + 'px';
    b.style.height = bh + 'px';
    skylineFar.appendChild(b);
    fx += bw + 30 + Math.random() * 60;
  }

  const signColors = ['magenta', 'red', 'green'];
  const count = Math.max(10, Math.ceil(w / 90));
  let x = -20;
  for (let i = 0; i < count; i++){
    const bw = 60 + Math.random() * 70;
    const bh = 80 + Math.random() * 220;
    const b = document.createElement('div');
    b.className = 'building';
    b.style.left = x + 'px';
    b.style.width = bw + 'px';
    b.style.height = bh + 'px';
    skyline.appendChild(b);

    const cols = Math.max(2, Math.floor(bw / 16));
    const rows = Math.max(3, Math.floor(bh / 22));
    for (let c = 0; c < cols; c++){
      for (let r = 0; r < rows; r++){
        if (Math.random() > 0.55) continue;
        const win = document.createElement('div');
        win.className = 'window' + (Math.random() > 0.85 ? ' cyan' : '') + (Math.random() > 0.55 ? ' flicker' : '');
        win.style.left = (x + 10 + c * 15) + 'px';
        win.style.bottom = (10 + r * 20) + 'px';
        win.style.animationDelay = (Math.random() * 6) + 's';
        skyline.appendChild(win);
      }
    }

    // roughly one in five buildings gets a hung neon sign
    if (Math.random() > 0.8 && bh > 110){
      const sign = document.createElement('div');
      const color = signColors[Math.floor(Math.random() * signColors.length)];
      const vertical = Math.random() > 0.5;
      sign.className = 'sign ' + color;
      if (vertical){
        sign.style.width = '5px';
        sign.style.height = (30 + Math.random() * 40) + 'px';
      } else {
        sign.style.width = (24 + Math.random() * 34) + 'px';
        sign.style.height = '5px';
      }
      sign.style.left = (x + bw * 0.3 + Math.random() * bw * 0.4) + 'px';
      sign.style.bottom = (bh * 0.3 + Math.random() * bh * 0.4) + 'px';
      sign.style.animationDelay = (Math.random() * 6) + 's';
      skyline.appendChild(sign);
    }

    x += bw + 6 + Math.random() * 14;
  }
})();

// reveal shelf sections + scrollspy nav highlighting
const io = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      const match = chipRefs.find(c => c.id === entry.target.id);
      chipRefs.forEach(c => c.el.classList.remove('active'));
      if (match) match.el.classList.add('active');
    }
  });
}, { threshold: 0.35 });
document.querySelectorAll('.shelf-section').forEach(el => io.observe(el));

// scroll progress bar
const progress = document.getElementById('progress');
function onScroll(){
  const doc = document.documentElement;
  const max = doc.scrollHeight - doc.clientHeight;
  const pct = max > 0 ? (doc.scrollTop / max) * 100 : 0;
  progress.style.width = pct + '%';
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

// occasional, brief glitch flicker on the headline — signal instability
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduceMotion){
  const titleEl = document.getElementById('mainTitle');
  setInterval(() => {
    titleEl.classList.add('glitching');
    setTimeout(() => titleEl.classList.remove('glitching'), 240);
  }, 7000 + Math.random() * 5000);
}

// one-time typewriter reveal of the headline
const fullTitle = "reading room";
const typedText = document.getElementById('typedText');
let ti = 0;
function typeNext(){
  if (ti <= fullTitle.length){
    typedText.textContent = fullTitle.slice(0, ti);
    ti++;
    setTimeout(typeNext, 75 + Math.random() * 55);
  }
}
typeNext();
</script>
